</head><body><div id="home">  <div class="hd">    <img src="minza.webp" style="width:44px;height:44px;object-fit:contain;flex-shrink:0"/>    <div>      <div class="brand">Azahar</div>      <div class="sub">3DS Emulator</div>    </div>  </div>  <div class="wrap">    <div class="drop" id="drop">      <input type="file" id="file-input" accept=".3ds,.cci, .zcci" multiple/>      <svg class="drop-ico" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">        <rect x="3" y="11" width="34" height="22" rx="3.5" stroke="#ede9cc" stroke-width="1.4"/>        <path d="M20 27V16M15 21l5-5 5 5" stroke="#b8d97a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>      </svg>      <div class="dt">Drop a ROM or click to browse</div>      <div class="dh">Add games to your library instantly</div>      <div class="tags">        <span class="tag">.3ds</span><span class="tag">.cci</span><span class="tag">.zcci</span></span>      </div>    </div>    <div class="lib">      <div class="lh">        <span class="lt">Library</span>        <button id="clr">Clear all</button>      </div>      <div id="roms">        <div class="empty" id="empty">no games uploaded</div>      </div>    </div>  </div></div><div id="emu"><canvas id="azahar-canvas"></canvas></div><div id="fps">-- fps</div><button id="back">← Library</button><div id="loader">  <img src="minza.webp" style="width:44px;height:44px;object-fit:contain"/>  <div class="lt2" id="loader-txt">Loading…</div></div><div id="toast"></div><script type="module">import createModule from "https://quantil.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3/assets/html/other/azahar/azahar.js";const EXTS=['.3ds','.cci','.zcci'];const W=400,H=480;let library=[],mod=null,running=false;const $=id=>document.getElementById(id);const home=$('home'),emu=$('emu'),canvas=$('azahar-canvas'),fps=$('fps'),      back=$('back'),drop=$('drop'),fi=$('file-input'),      roms=$('roms'),empty=$('empty'),clr=$('clr'),      loader=$('loader'),loaderTxt=$('loader-txt'),toast=$('toast');let tt;const showToast=m=>{toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),3000)};const fmtSize=b=>b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');function render(){  roms.querySelectorAll('.card').forEach(e=>e.remove());  empty.style.display=library.length?'none':'block';  clr.classList.toggle('v',library.length>0);  library.forEach((r,i)=>{    const c=document.createElement('div');c.className='card';    c.innerHTML=`<div class="ci"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></div><div style="flex:1;min-width:0"><div class="cn">${esc(r.name)}</div><div class="cm">${fmtSize(r.size)}</div></div><button class="del"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><div class="play"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#b8d97a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;    c.querySelector('.del').onclick=e=>{e.stopPropagation();library.splice(i,1);render()};    c.onclick=e=>{if(!e.target.closest('.del'))launch(i)};    roms.appendChild(c);  });}function addFiles(files){  Array.from(files).forEach(f=>{    if(!EXTS.some(x=>f.name.toLowerCase().endsWith(x))){showToast('Unsupported: '+f.name);return}    const r=new FileReader();    r.onload=e=>{library.push({name:f.name,size:f.size,data:new Uint8Array(e.target.result)});render()};    r.readAsArrayBuffer(f);  });}fi.onchange=e=>{addFiles(e.target.files);fi.value=''};drop.ondragover=e=>{e.preventDefault();d
